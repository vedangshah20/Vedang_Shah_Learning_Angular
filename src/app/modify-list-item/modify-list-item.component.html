<form [formGroup]="modifyForm" (ngSubmit)="onSubmit()">

  <!-- Gaming Console ID (for display or editing) -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" [readonly]="true" />
  </div>

  <!-- Brand -->
  <div class="form-group">
    <label for="brand">Brand</label>
    <input type="text" id="brand" formControlName="brand" required />
  </div>

  <!-- Model -->
  <div class="form-group">
    <label for="model">Model</label>
    <input type="text" id="model" formControlName="model" required />
  </div>

  <!-- Release Year -->
  <div class="form-group">
    <label for="releaseYear">Release Year</label>
    <input type="number" id="releaseYear" formControlName="releaseYear" required />
  </div>

  <!-- Storage Capacity -->
  <div class="form-group">
    <label for="storageCapacity">Storage Capacity (GB)</label>
    <input type="number" id="storageCapacity" formControlName="storageCapacity" required />
  </div>

  <!-- VR Support -->
  <div class="form-group">
    <label for="hasVRSupport">VR Support</label>
    <input type="checkbox" id="hasVRSupport" formControlName="hasVRSupport" />
  </div>

  <!-- Image URL -->
  <div class="form-group">
    <label for="imageUrl">Image URL</label>
    <input type="text" id="imageUrl" formControlName="imageUrl" required />
  </div>

  <!-- Submit and Back Buttons -->
  <button type="submit" [disabled]="modifyForm.invalid">Submit</button>
  <button type="button" (click)="navigateToHome()">Back to Home</button>

</form>
